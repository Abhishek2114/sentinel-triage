[project]
name = "sentinel-triage"
version = "0.1.0"
description = "AI-powered log anomaly detection and incident triage pipeline"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Abhishek Singh" }]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "redis>=5.0,<6",
    "celery[redis]>=5.4,<6",
    "httpx>=0.27,<1",
    "websockets>=13,<14",
    "scikit-learn>=1.5,<2",
    "numpy>=1.26,<3",
    "pgvector>=0.3,<1",
    "sentence-transformers>=3.0,<4",
    "openai>=1.0,<2",
    "python-multipart>=0.0.9",
    "structlog>=24.0,<25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=5,<6",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "pre-commit>=3,<4",
    "fakeredis>=2.26,<3",
]
lstm = [
    "torch>=2.3,<3",
]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are meant to be used as defaults
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers -v"

[tool.coverage.run]
# SQLAlchemy's async layer runs on greenlets; without this, every line after
# the first database await is reported as never executed
concurrency = ["greenlet", "thread"]

[tool.mypy]
# python_version is left to the running interpreter (CI runs 3.11)
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Celery ships without type hints, so its task decorator is untyped
module = "app.workers.*"
disallow_untyped_decorators = false
