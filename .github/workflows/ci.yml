name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel_secret
          POSTGRES_DB: sentinel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sentinel"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+asyncpg://sentinel:sentinel_secret@localhost:5432/sentinel_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check app/ tests/ scripts/ migrations/

      - name: Type check
        run: mypy app/ --ignore-missing-imports

      - name: Apply migrations to a real Postgres
        run: alembic upgrade head

      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npx vite build

  docker:
    runs-on: ubuntu-latest
    needs: [test, dashboard]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build api worker dashboard

      # The same stack docs/DEPLOY.md puts on a VPS, with Caddy's local CA for localhost
      - name: Start the production stack
        run: |
          cp deploy/.env.example deploy/.env
          sed -i -e 's/^DOMAIN=.*/DOMAIN=localhost/' \
                 -e 's/^ACME_EMAIL=.*/ACME_EMAIL=ci@example.com/' \
                 -e "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 32)/" \
                 -e 's/^API_KEYS=.*/API_KEYS=["ci-test-key"]/' deploy/.env
          docker compose -f deploy/docker-compose.prod.yml up -d --build --wait --wait-timeout 300

      - name: Smoke-test it over HTTPS
        run: |
          B=https://localhost
          code() { curl -ks -o /dev/null -w '%{http_code}' "$@"; }
          curl -ksf --retry 15 --retry-delay 2 --retry-all-errors $B/api/v1/health | grep -q '"db":"connected"'
          test "$(code $B/)" = 200                                   # dashboard served by the API
          test "$(code $B/docs)" = 404                               # no API docs in production
          test "$(code -X POST $B/api/v1/detect -H 'Content-Type: application/json' -d '{}')" = 401
          test "$(code -X POST $B/api/v1/detect -H 'Authorization: Bearer ci-test-key' -H 'Content-Type: application/json' -d '{}')" = 200
          test "$(code -X POST $B/api/v1/demo/run)" = 202            # public demo button
          for i in $(seq 1 30); do curl -ks $B/api/v1/incidents | grep -q '"service":"demo-' && break; sleep 2; done
          curl -ks $B/api/v1/incidents | grep -q '"service":"demo-'  # the demo produced an incident
          docker compose -f deploy/docker-compose.prod.yml ps

      # The free Hugging Face deploy: one container, cloned from this very commit
      - name: Build the Hugging Face Space image
        run: docker build -f deploy/huggingface/Dockerfile --build-arg REF=${{ github.sha }} -t sentinel-space deploy/huggingface

      - name: Smoke-test the Space image
        run: |
          docker network create space
          docker run -d --name space-db --network space -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=sentinel pgvector/pgvector:pg16
          docker run -d --name space-redis --network space redis:7-alpine
          # TCP only answers once the image's init scripts are done
          for i in $(seq 1 60); do docker exec space-db psql -U postgres -h localhost -d sentinel -c 'select 1' >/dev/null 2>&1 && break; sleep 1; done
          # A plain postgres:// URL with sslmode, the form Neon hands out
          docker run -d --name space --network space -p 7860:7860 \
            -e DATABASE_URL='postgres://postgres:ci@space-db:5432/sentinel?sslmode=disable' \
            -e REDIS_URL=redis://space-redis:6379/0 \
            -e API_KEYS='["ci-test-key"]' \
            sentinel-space
          B=http://localhost:7860
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          curl -sf --retry 30 --retry-delay 2 --retry-all-errors $B/api/v1/health | grep -q '"db":"connected"'
          test "$(code $B/)" = 200
          # The Space page may frame the app; nobody else may
          curl -sI $B/ | grep -i '^content-security-policy' | grep -q "frame-ancestors 'self' https://huggingface.co"
          ! curl -sI $B/ | grep -qi '^x-frame-options'
          test "$(code -X POST $B/api/v1/detect -H 'Content-Type: application/json' -d '{}')" = 401
          test "$(code -X POST $B/api/v1/demo/run)" = 202
          for i in $(seq 1 30); do curl -s $B/api/v1/incidents | grep -q '"service":"demo-' && break; sleep 2; done
          curl -s $B/api/v1/incidents | grep -q '"service":"demo-'

      # The free Render deploy: the root Dockerfile's default stage, run with render.yaml's
      # settings and on the port Render passes in PORT
      - name: Smoke-test the Render image
        run: |
          docker build -t sentinel-render .
          docker exec space-db createdb -U postgres render
          docker run -d --name render --network space -p 10000:10000 -e PORT=10000 \
            -e DATABASE_URL='postgres://postgres:ci@space-db:5432/render?sslmode=disable' \
            -e REDIS_URL=redis://space-redis:6379/1 \
            -e API_KEYS='["ci-test-key"]' \
            -e ENVIRONMENT=production -e AUTO_CREATE_TABLES=false -e DEMO_MODE=true \
            -e EMBEDDING_MODEL=hashing -e INPROCESS_SCHEDULER=true -e WEB_CONCURRENCY=1 \
            sentinel-render
          B=http://localhost:10000
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          curl -sf --retry 30 --retry-delay 2 --retry-all-errors $B/api/v1/health | grep -q '"db":"connected"'
          test "$(code $B/)" = 200
          curl -sI $B/ | grep -i '^x-frame-options' | grep -qi deny
          test "$(code -X POST $B/api/v1/detect -H 'Content-Type: application/json' -d '{}')" = 401
          test "$(code -X POST $B/api/v1/demo/run)" = 202
          for i in $(seq 1 30); do curl -s $B/api/v1/incidents | grep -q '"service":"demo-' && break; sleep 2; done
          curl -s $B/api/v1/incidents | grep -q '"service":"demo-'

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose -f deploy/docker-compose.prod.yml logs --tail 200
          docker logs space --tail 200 || true
          docker logs render --tail 200 || true
